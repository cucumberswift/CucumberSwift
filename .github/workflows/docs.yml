name: Docs

# Deploys the DocC site to GitHub Pages from the docs that each release carries
# as assets (docs-major.zip, docs-root.zip; see release.yml). Nothing is rebuilt.
#
# For every major, the highest stable release publishes at /X.x/. The highest
# stable release overall also publishes at the root. Releases without the
# assets are skipped.
#
# Runs after the Release workflow, or by hand. `workflow_run` always runs the
# copy of this file on the default branch.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

# Nothing by default; the job asks for what it uses. Only GITHUB_TOKEN is used.
permissions: {}

# Every run deploys the whole site from all releases, so a queued run can
# replace an older queued one. A deploy in progress is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

# `shell: bash` adds `-o pipefail`, so a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # contents: read -> list releases and download their assets.
    # pages: write, id-token: write -> deploy to GitHub Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Assemble the site
        run: |
          # Stable releases that carry both assets, lowest version first.
          tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select((.draft or .prerelease) | not)
                      | select([.assets[].name] | index("docs-major.zip") and index("docs-root.zip"))
                      | .tag_name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          if [ -z "$tags" ]; then
            echo "::error::No release has docs assets. Nothing to deploy."
            exit 1
          fi

          # Root first, then each major into its own directory.
          root=$(tail -n 1 <<< "$tags")
          echo "Root: $root"
          gh release download "$root" --pattern docs-root.zip --dir "dl/$root"
          unzip -q "dl/$root/docs-root.zip" -d site

          awk -F. '{ highest[$1] = $0 } END { for (m in highest) print highest[m] }' <<< "$tags" \
            | while read -r tag; do
                major="${tag%%.*}.x"
                echo "/$major/: $tag"
                gh release download "$tag" --pattern docs-major.zip --dir "dl/$tag"
                unzip -q "dl/$tag/docs-major.zip" -d "site/$major"
              done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
