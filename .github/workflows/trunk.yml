name: Version Bump

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ main ]
    types: [ completed ]

# This job does all of its writing with secrets.TYLER_PAT, not GITHUB_TOKEN, so the
# workflow token itself needs nothing beyond read. Do not widen this without also
# reviewing the release pipeline — see the audit on #131:
# https://github.com/cucumberswift/CucumberSwift/issues/131#issuecomment-5750715190
permissions:
  contents: read

jobs:
  version_bump:
    runs-on: macos-14
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TYLER_PAT }}
      - name: Bump version in Podspec and Plist
        id: bump_version
        run: |
          bundle exec fastlane patch
          VERSION=`/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Sources/CucumberSwift/Info.plist`
          echo "##[set-output name=version;]$VERSION"
      # NOTE: git-auto-commit-action is held at v4 by the repository's Actions allow-list.
      # A SHA pin would no longer match the allow-list. See the audit on #131:
      # https://github.com/cucumberswift/CucumberSwift/issues/131#issuecomment-5750715190
      - name: Commit version changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "[ci skip] Apply automatic changes"
          tagging_message: "${{ steps.bump_version.outputs.version }}"
          push_options: --force
      # NOTE: actions/create-release is ARCHIVED and unmaintained. Replacing it is
      # tracked separately with the trunk.yml rework — see the audit on #131:
      # https://github.com/cucumberswift/CucumberSwift/issues/131#issuecomment-5750715190
      - name: Create a GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TYLER_PAT }}
        with:
          tag_name: ${{ steps.bump_version.outputs.version }}
          release_name: Release ${{ steps.bump_version.outputs.version }}
          body: ''
