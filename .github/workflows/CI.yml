name: CI

# Pull requests run CI from the pull_request event, so pushes run it only on the
# long-lived branches: main and the support/N.x release lines. Any other branch
# runs CI only through a pull request.
on:
  pull_request:
  push:
    branches:
      - main
      - 'support/**'
  workflow_dispatch:

# Least privilege. The repository default for GITHUB_TOKEN is `write`; these jobs
# only read the checkout, so they are pinned to read.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run TESTS
        run: fastlane unit_test
      # NOTE: codecov-action is held at v1 by the repository's Actions allow-list.
      # A SHA pin would no longer match that entry, so this stays on the tag.
      # Pull requests from forks have no token, so only a push fails on an upload error.
      - uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  build_for_package_managers:
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate SwiftPM BUILDs
        run: fastlane build_swiftpm
      - name: Validate Cocoapods Can Deploy (lib lint)
        run: fastlane cocoapods_liblint

  release_script:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run the release script tests
        run: python3 -m unittest discover -s .github/scripts -v

  # Carthage builds CucumberSwift from the committed Xcode project and its shared
  # CucumberSwift scheme, with no chance to run a generator first. Nothing else in
  # CI builds that path, so this job is the only check that Carthage consumers can
  # still install the framework. It needs no Tuist: consumers never do.
  #
  # Several Xcode versions, because whether the archive succeeds depends on the
  # Xcode version, and consumers use whatever Xcode they have. `default` is the
  # runner image's own Xcode; the macos-15 image also carries Xcode 26.
  carthage:
    name: Carthage build (${{ matrix.os }}, Xcode ${{ matrix.xcode }}${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            xcode: default
          - os: macos-15
            xcode: default
          - os: macos-15
            xcode: '26.2'
          # EXPERIMENT, remove before merging: the same build with
          # CucumberSwiftExpressions patched to a dynamic library product, to test
          # whether that fixes the Xcode 26 archive failure.
          - os: macos-15
            xcode: '26.2'
            dynamic: true
            variant: ', dynamic Expressions experiment'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != 'default'
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          find /Applications -maxdepth 1 -name 'Xcode*.app' | sort
          app=$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_VERSION}*.app" | sort | head -1)
          if [ -z "$app" ]; then echo "::error::Xcode $XCODE_VERSION is not installed on this image"; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Install Carthage
        run: command -v carthage || brew install carthage
      - name: Make CucumberSwiftExpressions a dynamic product (experiment)
        if: matrix.dynamic
        run: |
          xcodebuild -resolvePackageDependencies -project CucumberSwift.xcodeproj -scheme CucumberSwift
          manifest=$(find ~/Library/Developer/Xcode/DerivedData -path '*/SourcePackages/checkouts/CucumberSwiftExpressions/Package.swift' | head -1)
          if [ -z "$manifest" ]; then echo "::error::CucumberSwiftExpressions checkout not found"; exit 1; fi
          echo "checkout revision: $(git -C "$(dirname "$manifest")" rev-parse HEAD)"
          perl -0pi -e 's/(\.library\(\s*name: "CucumberSwiftExpressions",)/$1 type: .dynamic,/' "$manifest"
          git -C "$(dirname "$manifest")" diff
          grep -q 'type: .dynamic' "$manifest" || { echo "::error::patch did not apply"; exit 1; }
      - name: Build the framework with Carthage
        run: carthage build --no-skip-current --use-xcframeworks --platform iOS --log-path carthage-build.log
      - name: Show what Carthage produced
        run: find Carthage/Build -maxdepth 3 \( -name '*.framework' -o -name '*.xcframework' \) | sort
      - name: Check how CucumberSwiftExpressions is linked (experiment)
        if: always() && matrix.dynamic
        run: |
          bin=Carthage/Build/CucumberSwift.xcframework/ios-arm64/CucumberSwift.framework/CucumberSwift
          if [ -f "$bin" ]; then otool -L "$bin" | grep -i expressions || echo "no dynamic CucumberSwiftExpressions dependency"; fi
          echo "CucumberSwiftExpressions artefacts delivered by Carthage:"
          find Carthage/Build -iname '*CucumberSwiftExpressions*' || true
      - name: Show why the build failed
        if: failure()
        run: |
          grep -E '(^|[ /:])error: |\*\* (ARCHIVE|BUILD) (FAILED|SUCCEEDED)' carthage-build.log | sort -u | head -20 || true
