name: CI

# Pull requests run CI from the pull_request event, so pushes run it only on the
# long-lived branches: main and the support/N.x release lines. Any other branch
# runs CI only through a pull request. The merge queue runs it on the merge_group
# event, on a temporary branch holding the pull request on top of main.
#
# A pull request runs each check once, on the newest toolchain. The merge queue,
# main, support/N.x, the nightly run and manual runs add the older variants
# (Xcode 16.0, the oldest Xcode on the macos-15 image and so the oldest CucumberSwift
# supports, and the oldest Bazel), so every change is checked on all of them before
# it merges. The parallel tests skip the merge queue, run when the code changes
# on pull requests and main (the full matrix on main), and run the full matrix on
# every nightly and manual run (see parallel_tests).
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - 'support/**'
  schedule:
    # Nightly at 04:23 UTC, off the hour to avoid GitHub's scheduling peak.
    - cron: '23 4 * * *'
  workflow_dispatch:

# A new push to a pull request cancels the run it replaces, so the old run stops
# holding macOS runners that merge queue entries wait for. Every other run gets
# a group of its own and is never cancelled or held back: merge_group runs are
# what the queue merges on, and push runs check main and support/N.x.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. The repository default for GITHUB_TOKEN is `write`; these jobs
# only read the checkout, so they are pinned to read.
permissions:
  contents: read

env:
  # The fewest tests the CucumberSwift scheme's test bundles may run together, on
  # the iOS Simulator (iOS tests) and on Mac Catalyst (Catalyst tests). A test that
  # silently stops running still reports success (#231), so
  # .github/scripts/xcode-test.sh fails below this. It is what the three bundles
  # run today (434 + 61 + 28): raise it when you add tests.
  MIN_TESTS: 523

# Job names are the check names that pull requests and rulesets show: short, in
# sentence case, "<what> tests" for a job that runs tests. A variant that runs
# only outside pull requests adds what differs in parentheses, such as
# "Carthage tests (Xcode 16)". The required checks are iOS tests, Project checks,
# SwiftPM tests and Fixture tests: renaming one means changing the main ruleset
# at the same time, or every pull request waits for a check that never reports.
jobs:
  # Works out whether this run only changes documentation, with
  # .github/scripts/docs_only.py, which says what counts. On a docs-only pull
  # request or merge queue run, the jobs that build and test code are skipped,
  # and a skipped job reports Skipped, which counts as passing for a required
  # check. Pushes and manual runs always run everything. Each skipped job checks
  # `!cancelled()`, so if this job fails they run rather than skip. Path filters
  # on the whole workflow are not used: they would leave required checks waiting.
  # A matrix job skipped this way reports one check with its name unexpanded,
  # such as "Bazel tests${{ matrix.variant }}", so a required check that a
  # matrix job reports would wait forever on a docs-only run. Make it a job
  # without a matrix before requiring it.
  #
  # It also works out whether the parallel tests run (see parallel_tests).
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      parallel_tests: ${{ steps.parallel.outputs.parallel_tests }}
    steps:
      # The full history, for the merge base, but only the paths: the diffs read
      # no file contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts
      - name: Decide whether this run only changes documentation
        id: changes
        run: python3 .github/scripts/docs_only.py
      # Never in the merge queue: the parallel tests are not required checks, and the
      # pull request has run them. On a pull request or a push, only when the code, the
      # fixtures, the package manifests, the tool versions or this workflow change, not
      # the documentation, which lives in Sources too. Always on a nightly or manual run.
      - name: Decide whether the parallel tests run
        id: parallel
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          relevant='^(Sources/|Tests/ParallelFixtures/|Package(@swift-[0-9.]+)?\.swift$|\.mise\.toml$|\.github/workflows/CI\.yml$|\.github/scripts/parallel-fixture\.sh$)'
          if [ "$EVENT" = merge_group ]; then
            run=false
          elif [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; then
            run=true
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            run=true
          elif git diff --no-renames --name-only "$BASE" "$HEAD" | grep -vE '\.docc/' | grep -qE "$relevant"; then
            run=true
          else
            run=false
          fi
          echo "Parallel tests run: $run"
          echo "parallel_tests=$run" >> "$GITHUB_OUTPUT"

  # Builds the DocC catalog as the Release workflow does, on every change,
  # docs-only or not. --warnings-as-errors fails on anything DocC warns about,
  # such as a broken symbol or page link, a missing image or a malformed directive.
  docs:
    name: Docs
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      - name: Build the documentation
        run: swift package generate-documentation --target CucumberSwift --warnings-as-errors

  # codecov/patch is a required check that Codecov posts only after an upload,
  # and iOS tests, which uploads coverage, is skipped on a docs-only run.
  # This tells Codecov the commit has no coverage to report, and Codecov passes
  # its checks. `force`, because without it Codecov passes only when it counts
  # every changed file as untestable itself, which LICENSE and DocC tutorials are
  # not, and it reads those files from a pull request, which a merge queue commit
  # does not have.
  coverage_docs_only:
    name: Coverage (docs only)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The uploader reads the pull request's head commit from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: empty-upload
          force: true
          fail_ci_if_error: true

  # The iOS Simulator run, and the coverage report codecov/patch reads. A required
  # check. Name the destination: the scheme also builds for Mac Catalyst, which
  # Catalyst tests covers. OS=latest is the newest iOS Simulator runtime on the
  # runner image.
  ios_tests:
    name: iOS tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Run the tests on an iOS Simulator
        run: .github/scripts/xcode-test.sh -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' -enableCodeCoverage YES
      # Finds the coverage xcodebuild wrote to the default DerivedData folder.
      # Pull requests from forks have no token, so only a push fails on an upload error.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  # Three quick checks of the package and the Xcode project, in one job so they
  # share one macOS runner. A required check. Each check runs even when one
  # before it failed, so one run reports every problem.
  #
  # - The Xcode project matches Project.swift. CucumberSwift.xcodeproj is
  #   generated from Project.swift and committed for Carthage. This fails when
  #   the two disagree, for example after a hand edit to the project or a new
  #   source file committed without regenerating. It runs the same
  #   `mise run check-project` task as the optional pre-commit hook. First, while
  #   the checkout is clean.
  # - The manifests match their lockfiles. Package.swift and the Xcode project
  #   each have a lockfile. This fails when a manifest's lower bound is not the
  #   version its lockfile pins, when a lockfile is stale or does not satisfy its
  #   manifest, or when the two lockfiles pin a shared package differently.
  #   Dependabot updates only Package.swift and Package.resolved, so its pull
  #   requests fail here until the Xcode side is updated to match.
  # - The package builds for release with SwiftPM, from only the versions
  #   Package.resolved pins.
  project_checks:
    name: Project checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise --version
          mise install
      - name: Check the Xcode project matches Project.swift
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise run check-project
      - name: Check each manifest against its lockfile
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check_lockfiles.py --resolve
      - name: Build the package for release with SwiftPM
        if: ${{ !cancelled() }}
        run: swift build --configuration release --build-path ./build --force-resolved-versions

  # The tests of the Python scripts in .github/scripts: the release script, the
  # lockfile check and the docs-only check.
  script_tests:
    name: Script tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run the script tests
        run: python3 -m unittest discover -s .github/scripts -v

  # The pre-commit hook runs actionlint too, but a commit can skip it. The versions
  # are the ones .mise.lint.toml pins. Each download is checked against the digest
  # GitHub publishes for it, as mise does.
  workflow_checks:
    name: Workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pinned actionlint and ShellCheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pinned() { sed -n "s|^\"aqua:$1\" = \"\(.*\)\"$|\1|p" .mise.lint.toml; }
          download() { # repository, tag, asset
            gh release download "$2" --repo "$1" --pattern "$3" --dir "$RUNNER_TEMP"
            digest=$(gh api "repos/$1/releases/tags/$2" --jq ".assets[] | select(.name == \"$3\") | .digest")
            echo "${digest#sha256:}  $RUNNER_TEMP/$3" | sha256sum --check
            tar -xf "$RUNNER_TEMP/$3" -C "$RUNNER_TEMP/bin"
          }
          mkdir "$RUNNER_TEMP/bin"
          actionlint=$(pinned rhysd/actionlint)
          shellcheck=$(pinned koalaman/shellcheck)
          download rhysd/actionlint "v$actionlint" "actionlint_${actionlint}_linux_amd64.tar.gz"
          download koalaman/shellcheck "v$shellcheck" "shellcheck-v$shellcheck.linux.x86_64.tar.xz"
          mv "$RUNNER_TEMP/bin/shellcheck-v$shellcheck/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check the workflows
        run: |
          actionlint --version
          shellcheck --version
          actionlint

  # Carthage builds CucumberSwift from the committed Xcode project and its shared
  # CucumberSwift scheme, with no chance to run a generator first. Nothing else in
  # CI builds that path, so this job is the only check that Carthage consumers can
  # still install the framework. It needs no Tuist: consumers never do.
  #
  # Two Xcode versions, because consumers build with whatever Xcode they have.
  # Pull requests run Xcode 26, which a new release most likely breaks. The merge
  # queue and main also run Xcode 16.0, the oldest Xcode CI builds with, after
  # installing its iOS platform, which the image doesn't have.
  carthage_tests:
    name: Carthage tests${{ matrix.variant }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"xcode":"26.2","variant":""}]'
          || '[{"xcode":"26.2","variant":""},{"xcode":"16.0","variant":" (Xcode 16)","ios_platform":true}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode ${{ matrix.xcode }}
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: .github/scripts/select-xcode.sh "$XCODE_VERSION"
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      # The macos-15 image has Xcode 16.0's iOS 18.0 SDK but no iOS platform older than 18.5,
      # and without its own platform Xcode 16.0 offers no iOS destination, so Carthage's iOS
      # build fails. Installing it downloads about 8 GB, in about 4 minutes. The download fails
      # with "Unable to connect to simulator" until simctl has started the simulator service.
      - name: Install the iOS platform for Xcode ${{ matrix.xcode }}
        if: matrix.ios_platform
        run: |
          xcrun simctl list runtimes > /dev/null
          xcodebuild -downloadPlatform iOS
      - name: Install Carthage
        run: command -v carthage || brew install carthage
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise --version
          mise install
      # Builds the framework with Carthage, then runs Fixtures/CarthageXCFramework: an iOS test
      # target that links and embeds it and runs step definitions with Cucumber expressions, once
      # the build folder is gone, as on a consumer's machine.
      - name: Build the framework with Carthage and test a project that uses it
        env:
          CARTHAGE_LOG: carthage-build.log
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          # The pinned Tuist can't generate the fixture's project with Xcode 16.0.
          TUIST_DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: mise run test-carthage
      - name: Show what Carthage produced
        if: always()
        run: find Carthage/Build -maxdepth 5 \( -name '*.framework' -o -name '*.xcframework' -o -name '*.swiftmodule' \) | sort || true
      # An unsigned build kept for inspection, not a distribution channel. One
      # matrix entry, so each run has one artifact. The wildcard keeps the
      # CucumberSwift.xcframework folder itself in the artifact, not just its contents.
      - name: Upload the xcframework
        if: matrix.xcode == '26.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CucumberSwift.xcframework
          path: Carthage/Build/*.xcframework
          if-no-files-found: error
          retention-days: 7
      - name: Show why the build failed
        if: failure()
        run: |
          grep -E '(^|[ /:])error: |\*\* (ARCHIVE|BUILD) (FAILED|SUCCEEDED)' carthage-build.log | sort -u | head -20 || true

  # The test command CONTRIBUTING.md gives contributors runs on Mac Catalyst, but
  # iOS tests runs on an iOS Simulator and never exercises Catalyst. The two
  # destinations run test suites in a different order, which hid an
  # order-dependent failure on the Simulator for years (#183), so run the
  # documented command as written.
  #
  # Pull requests run Xcode 26, on macos-26: the macos-15 image carries Xcode 26
  # too, but its host is macOS 15, and Xcode 26 will not run Catalyst tests there.
  # The merge queue and main also run Xcode 16.0, on macos-15. In the nightly and
  # manual runs, that variant also builds Package.swift, which only Swift 6.0
  # reads: Xcode 16.3 and later read Package@swift-6.1.swift. That variant also runs
  # the Xcode project fixture that uses the macros through a local package, with
  # Xcode 16.3, the oldest Xcode the docs give for that route (Fixture tests runs it
  # with a newer one).
  catalyst_tests:
    name: Catalyst tests${{ matrix.variant }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os":"macos-26","variant":""}]'
          || '[{"os":"macos-26","variant":""},{"os":"macos-15","xcode":"16.0","variant":" (Xcode 16)"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: .github/scripts/select-xcode.sh "$XCODE_VERSION"
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run the tests on Mac Catalyst
        run: .github/scripts/xcode-test.sh -destination 'platform=macOS,variant=Mac Catalyst' CODE_SIGNING_ALLOWED=NO
      - name: Build Package.swift with Swift 6.0
        if: matrix.xcode == '16.0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: swift build --force-resolved-versions
      - name: Install mise
        if: matrix.xcode == '16.0'
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        if: matrix.xcode == '16.0'
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise install
      # Installs Xcode 16.3's iOS 18.4 platform, which the image doesn't have: about 8 GB.
      - name: Run the macros through a local package with Xcode 16.3
        if: matrix.xcode == '16.0'
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          TUIST_DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: mise exec -- .github/scripts/macros-trait-fixture.sh 16.3

  # Experimental parallel testing (#31). Runs the fixtures in Tests/ParallelFixtures with
  # Xcode's parallel testing on: unit tests without a host app, unit tests hosted in an app,
  # and UI tests, on iOS and tvOS Simulators, macOS and Mac Catalyst.
  # .github/scripts/parallel-fixture.sh runs one combination and says when it fails.
  #
  # They need many macOS runners, so they run only when the changes job says so (never in
  # the merge queue), the rest wait for the macOS hostless combination here to pass, and
  # the first failure cancels the others. A pull request runs the hosted tests on each
  # platform with Xcode 26. Main, nightly and manual runs run every combination with
  # Xcode 26 on macos-26, and iOS and Mac Catalyst with Xcode 16.4 on macos-15 too.
  # Nightly and manual runs also run tvOS and macOS with Xcode 16.4. Parallel testing
  # states what it has been tried with, not the oldest supported Xcode (#325): 16.4 is
  # the oldest Xcode the image has Simulator runtimes for, and the pinned Tuist can't
  # generate the fixtures' project with Xcode 16.0.
  parallel_smoke:
    name: Parallel tests (macOS, hostless)
    needs: changes
    if: needs.changes.outputs.parallel_tests == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise install
      - name: Generate the fixtures' project
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise run generate-fixtures
      - name: Run the parallel fixture
        env:
          PLATFORM: macOS
          KIND: Hostless
        run: .github/scripts/parallel-fixture.sh

  parallel_tests:
    name: Parallel tests (${{ matrix.platform }}, ${{ matrix.kind }}${{ matrix.xcode == '16' && ', Xcode 16' || '' }})
    needs: [changes, parallel_smoke]
    if: needs.changes.outputs.parallel_tests == 'true'
    runs-on: ${{ matrix.xcode == '16' && 'macos-15' || 'macos-26' }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: true
      # The values are what the check names show; the steps turn them into what
      # parallel-fixture.sh takes. No `include`: an entry that matches no
      # combination, as on a pull request, would add a job of its own.
      matrix:
        xcode: ${{ fromJSON(github.event_name == 'pull_request' && '["26"]' || '["16","26"]') }}
        platform: [iOS, tvOS, macOS, Catalyst]
        kind: ${{ fromJSON(github.event_name == 'pull_request' && '["hosted"]' || '["hostless","hosted","UI"]') }}
        # Xcode 26's macOS hostless combination runs first, in parallel_smoke. Xcode 16.4's
        # tvOS and macOS combinations run only in the nightly and manual runs.
        exclude: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '[{"xcode":"26","platform":"macOS","kind":"hostless"}]'
          || '[{"xcode":"26","platform":"macOS","kind":"hostless"},{"xcode":"16","platform":"tvOS"},{"xcode":"16","platform":"macOS"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 16.4
        if: matrix.xcode == '16'
        run: .github/scripts/select-xcode.sh 16.4
      - name: Show the toolchain
        run: xcodebuild -version
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise install
      - name: Generate the fixtures' project
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise run generate-fixtures
      # Two workers on a Simulator, not three: booting a third clone on a busy runner timed
      # out. UI tests on a Mac have only been tried with one worker.
      - name: Run the parallel fixture
        env:
          PLATFORM: ${{ matrix.platform == 'iOS' && 'iOS Simulator' || matrix.platform == 'tvOS' && 'tvOS Simulator' || matrix.platform == 'Catalyst' && 'Mac Catalyst' || 'macOS' }}
          KIND: ${{ matrix.kind == 'hostless' && 'Hostless' || matrix.kind == 'hosted' && 'Hosted' || 'UI' }}
          WORKERS: ${{ (matrix.platform == 'iOS' || matrix.platform == 'tvOS') && 2 || matrix.kind == 'UI' && 1 || 3 }}
        run: .github/scripts/parallel-fixture.sh

  # `swift test`, as CONTRIBUTING.md gives it (and `mise run test-swiftpm` runs).
  # SwiftPM links all of a package's test targets into one test bundle, and each
  # consumer test target declares its own `extension Cucumber: StepImplementation`,
  # so each consumer test folder is a package of its own and runs separately.
  # A required check.
  swiftpm_tests:
    name: SwiftPM tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      # Every trait on, so the step definition macros (the Macros trait) and their tests build too.
      # The consumer packages below turn no trait on, as most projects that use CucumberSwift.
      - name: Run the root package's tests
        run: swift test --enable-all-traits --skip 'CucumberSwift\.CucumberTest'
      - name: Run the consumer tests
        run: swift test --package-path Tests/CucumberSwiftConsumerTests
      - name: Run the DSL consumer tests
        run: swift test --package-path Tests/CucumberSwiftDSLConsumerTests
      - name: Run the Swift 6 language mode consumer tests
        run: swift test --package-path Tests/CucumberSwiftSwift6ConsumerTests
      # Uses the step definition macros as a project would: the Macros trait turned on from its own
      # Package.swift, with Xcode 16.3 (Swift 6.1), the oldest Xcode the docs give for the macros in
      # a Swift package. Fixture tests runs it on a newer one.
      - name: Run the step definition macros package fixture with Xcode 16.3
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
        run: |
          swift --version
          swift test --package-path Fixtures/StepDefinitionMacrosPackage
      # Runs feature files with Swift Testing as a project would: the build tool plugin and the macros,
      # with Xcode 16.3 (Swift 6.1), the oldest Xcode the docs give for the Swift Testing runner.
      # The Fixtures job runs it on a newer one.
      - name: Run the Swift Testing package fixture with Xcode 16.3
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
        run: |
          swift --version
          swift test --package-path Fixtures/SwiftTestingPackage

  # Builds and tests every project in Fixtures/ as a project that uses CucumberSwift would, Tuist
  # projects included (`mise run test-fixtures`). macos-26, because a Tuist fixture that turns on a
  # package trait only compiles with Xcode 26.4 or later; that fixture runs with exactly Xcode 26.4,
  # named in its xcode-version file. A required check.
  fixture_tests:
    name: Fixture tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise --version
          mise install
      - name: Build and test the fixtures
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise run test-fixtures

  # Checks the Bazel module the way a Bazel project uses it, so BUILD.bazel and
  # MODULE.bazel cannot drift from Package.swift or break for consumers:
  # - against a `git archive` of the commit, which is what the release's source
  #   archive (and so the Bazel Central Registry entry) contains, not the checkout;
  # - from Tests/, a separate module that depends on this one;
  # - on every Bazel major that MODULE.bazel's bazel_compatibility allows, and
  #   on macOS and an iOS simulator, at the lowest OS versions consumers use.
  bazel_tests:
    name: Bazel tests${{ matrix.variant }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The check names hold no version number, so they stay the same when the
      # versions change. An empty version means Bazelisk runs .bazelversion. The
      # oldest major that bazel_compatibility in MODULE.bazel allows, 8.x, runs
      # outside pull requests only.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"bazel":"","variant":""}]'
          || '[{"bazel":"","variant":""},{"bazel":"8.x","variant":" (oldest Bazel)"}]') }}
    env:
      # The runner's `bazel` is Bazelisk, which runs this version, or .bazelversion.
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the Bazel version
        run: bazel version
      - name: Check MODULE.bazel's CucumberSwiftExpressions is at least Package.swift's
        run: |
          spm=$(sed -n 's/.*CucumberSwiftExpressions.git", from: "\([0-9.]*\)".*/\1/p' Package.swift)
          bzl=$(sed -n 's/.*bazel_dep(name = "cucumberswift_expressions", version = "\([0-9.]*\)".*/\1/p' MODULE.bazel)
          echo "Package.swift: from $spm, MODULE.bazel: $bzl"
          if [ -z "$spm" ] || [ -z "$bzl" ] || [ "$(printf '%s\n%s\n' "$spm" "$bzl" | sort -V | head -1)" != "$spm" ]; then
            echo "::error::MODULE.bazel must depend on CucumberSwiftExpressions $spm or later, the version Package.swift starts from."
            exit 1
          fi
          echo "EXPRESSIONS_VERSION=$bzl" >> "$GITHUB_ENV"
      - name: Unpack the commit as the release archive will contain it
        run: |
          mkdir "$RUNNER_TEMP/module"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/module"
          echo "MODULE_PATH=$RUNNER_TEMP/module" >> "$GITHUB_ENV"
      # Until the Bazel Central Registry has cucumberswift_expressions
      # (bazelbuild/bazel-central-registry#10867), use the source archive of the
      # release MODULE.bazel names, which is what that entry will contain. Then
      # remove this step and the cucumberswift_expressions --override_module below.
      - name: Fetch CucumberSwiftExpressions
        run: |
          mkdir "$RUNNER_TEMP/expressions"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/cucumberswift/CucumberSwiftExpressions/archive/refs/tags/$EXPRESSIONS_VERSION.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/expressions"
          echo "EXPRESSIONS_PATH=$RUNNER_TEMP/expressions" >> "$GITHUB_ENV"
      - name: Build every target in the module, as a consumer would
        working-directory: Tests
        run: bazel build @cucumberswift//... --override_module=cucumberswift="$MODULE_PATH" --override_module=cucumberswift_expressions="$EXPRESSIONS_PATH"
      - name: Run the consumer tests on macOS and on an iOS simulator
        working-directory: Tests
        run: bazel test //... --override_module=cucumberswift="$MODULE_PATH" --override_module=cucumberswift_expressions="$EXPRESSIONS_PATH" --test_output=errors
      # A run with no features still passes, so this catches a Features folder
      # Bazel left out. The floors are what `swift test` runs for each suite.
      - name: Check every feature ran
        working-directory: Tests
        run: |
          status=0
          for suite in CucumberSwiftConsumerTests:61 CucumberSwiftDSLConsumerTests:28 CucumberSwiftSwift6ConsumerTests:10; do
            name=${suite%%:*}; min=${suite##*:}
            for t in "$name" "${name}_iOS"; do
              # A log with no count, or no log, counts as 0 rather than ending the step.
              n=$(grep -Eo 'Executed [0-9]+ tests' "bazel-testlogs/$t/test.log" 2>/dev/null | tail -1 | grep -Eo '[0-9]+' || true)
              echo "$t: ${n:-0} tests (at least $min expected)"
              if [ "${n:-0}" -lt "$min" ]; then
                echo "::error::Only ${n:-0} tests ran in $t. If you removed tests on purpose, lower its floor in CI.yml."
                status=1
              fi
            done
          done
          exit $status
