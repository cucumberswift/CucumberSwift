name: CI

# Pull requests run CI from the pull_request event, so pushes run it only on the
# long-lived branches: main and the support/N.x release lines. Any other branch
# runs CI only through a pull request. The merge queue runs it on the merge_group
# event, on a temporary branch holding the pull request on top of main.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - 'support/**'
  workflow_dispatch:

# Least privilege. The repository default for GITHUB_TOKEN is `write`; these jobs
# only read the checkout, so they are pinned to read.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run TESTS
        run: fastlane unit_test
      # NOTE: codecov-action is held at v1 by the repository's Actions allow-list.
      # A SHA pin would no longer match that entry, so this stays on the tag.
      # Pull requests from forks have no token, so only a push fails on an upload error.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  build_for_package_managers:
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate SwiftPM BUILDs
        run: fastlane build_swiftpm

  release_script:
    name: Release script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run the release script tests
        run: python3 -m unittest discover -s .github/scripts -v

  # Carthage builds CucumberSwift from the committed Xcode project and its shared
  # CucumberSwift scheme, with no chance to run a generator first. Nothing else in
  # CI builds that path, so this job is the only check that Carthage consumers can
  # still install the framework. It needs no Tuist: consumers never do.
  #
  # Several Xcode versions, because consumers build with whatever Xcode they have,
  # so a new Xcode that breaks this path should show up here first. `default` is
  # the runner image's own Xcode; the macos-15 image also carries Xcode 26.
  carthage:
    name: Carthage build (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            xcode: default
          - os: macos-15
            xcode: default
          - os: macos-15
            xcode: '26.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != 'default'
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          find /Applications -maxdepth 1 -name 'Xcode*.app' | sort
          app=$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_VERSION}*.app" | sort | head -1)
          if [ -z "$app" ]; then echo "::error::Xcode $XCODE_VERSION is not installed on this image"; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Install Carthage
        run: command -v carthage || brew install carthage
      - name: Build the framework with Carthage
        run: carthage build --no-skip-current --use-xcframeworks --platform iOS --log-path carthage-build.log
      - name: Show what Carthage produced
        run: find Carthage/Build -maxdepth 3 \( -name '*.framework' -o -name '*.xcframework' \) | sort
      # A build is not proof a consumer can use it. CucumberSwiftExpressions is a
      # static package, so it must be inside the framework rather than a separate
      # dynamic dependency that Carthage would not deliver; and the framework must
      # import and link from outside this project.
      - name: Check a consumer can link the framework
        run: |
          set -eu
          xcf=Carthage/Build/CucumberSwift.xcframework
          if otool -L "$xcf/ios-arm64/CucumberSwift.framework/CucumberSwift" | grep -i 'CucumberSwiftExpressions'; then
            echo "::error::CucumberSwift links CucumberSwiftExpressions dynamically, which Carthage does not deliver"
            exit 1
          fi
          sim=""
          for slice in "$xcf"/*-simulator; do sim=$slice; done
          if [ -z "$sim" ] || [ ! -d "$sim" ]; then echo "::error::no simulator slice in $xcf"; exit 1; fi
          platform=$(xcrun --sdk iphonesimulator --show-sdk-platform-path)
          cat > "$RUNNER_TEMP/Consumer.swift" <<'SWIFT'
          import CucumberSwift
          public func consumerTouchesCucumber() -> Cucumber { Cucumber.shared }
          SWIFT
          xcrun --sdk iphonesimulator swiftc -target arm64-apple-ios13.0-simulator \
            -F "$sim" -F "$platform/Developer/Library/Frameworks" \
            -I "$platform/Developer/usr/lib" -L "$platform/Developer/usr/lib" \
            -framework CucumberSwift -framework XCTest \
            -emit-library -o "$RUNNER_TEMP/libConsumer.dylib" "$RUNNER_TEMP/Consumer.swift"
          echo "A consumer imported and linked CucumberSwift from $sim"
      # An unsigned build kept for inspection, not a distribution channel. One
      # matrix entry, so each run has one artifact. The wildcard keeps the
      # CucumberSwift.xcframework folder itself in the artifact, not just its contents.
      - name: Upload the xcframework
        if: matrix.xcode == '26.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CucumberSwift.xcframework
          path: Carthage/Build/*.xcframework
          if-no-files-found: error
          retention-days: 7
      - name: Show why the build failed
        if: failure()
        run: |
          grep -E '(^|[ /:])error: |\*\* (ARCHIVE|BUILD) (FAILED|SUCCEEDED)' carthage-build.log | sort -u | head -20 || true

  # CucumberSwift.xcodeproj is generated from Project.swift and committed for
  # Carthage. This fails when the two disagree, for example after a hand edit to the
  # project or a new source file committed without regenerating. It runs the same
  # `mise run check-project` task as the optional pre-commit hook.
  project_drift:
    name: Xcode project matches Project.swift
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise --version
          mise install
      - name: Regenerate and compare
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise run check-project

  # Package.swift and the Xcode project each have a lockfile. This fails when a
  # manifest's lower bound is not the version its lockfile pins, when a lockfile is
  # stale or does not satisfy its manifest, or when the two lockfiles pin a shared
  # package differently. Dependabot updates only Package.swift and Package.resolved,
  # so its pull requests fail here until the Xcode side is updated to match. No
  # path filter, so it runs on every pull request and can be a required check.
  lockfiles:
    name: Manifests match their lockfiles
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check each manifest against its lockfile
        run: python3 .github/scripts/check_lockfiles.py --resolve

  # The test command CONTRIBUTING.md gives contributors runs on Mac Catalyst, but
  # the `test` job above runs `fastlane unit_test`, which picks an iOS Simulator
  # and never exercises Catalyst. The two destinations run test suites in a
  # different order, which hid an order-dependent failure on the Simulator for
  # years (#183), so run the documented command as written.
  #
  # Xcode 26 runs on macos-26: the macos-15 image carries Xcode 26 too, but its host
  # is macOS 15, and Xcode 26 will not run Catalyst tests there.
  test_catalyst:
    name: Catalyst tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: xcodebuild -version
      - name: Run the tests on Mac Catalyst
        # A test that silently stops running still reports success (#231), so the
        # step also fails when fewer tests run than this. It is the number the
        # three test bundles run today (400 + 61 + 28): raise it when you add tests.
        # Count from the log, not the .xcresult, which merges suites that share a name.
        env:
          MIN_TESTS: 489
        run: |
          set +e
          xcodebuild test -scheme CucumberSwift -destination 'platform=macOS,variant=Mac Catalyst' CODE_SIGNING_ALLOWED=NO > catalyst-test.log 2>&1
          status=$?
          grep -E "Test Suite '.*\.(xctest|framework)' (passed|failed)" -A1 catalyst-test.log | grep -E 'Executed' | sort -u
          grep -E ': error: -\[' catalyst-test.log | sed -E 's|^.*/Resources/||' | sort -u | head -20
          # A failure before any test runs (a bad destination, a build error)
          # prints no counts, so show xcodebuild's own errors too.
          grep -E -A4 'xcodebuild: error|\*\* (BUILD|TEST) FAILED' catalyst-test.log | head -30
          # Each bundle runs in a process of its own, which ends with one
          # "All tests" or "Selected tests" total.
          totals=$(grep -E "^Test Suite '(All|Selected) tests' (passed|failed)" -A1 catalyst-test.log | grep -oE 'Executed [0-9]+' | grep -oE '[0-9]+')
          total=$(( $(echo "$totals" | paste -sd+ -) + 0 ))
          echo "Tests run by each bundle: $(echo $totals), $total in all (at least $MIN_TESTS expected)"
          # XCTest never hands CucumberSwift's generated scenario tests to a parallel
          # worker, so a parallel bundle drops them (#231). Only a parallel run prints
          # "Test suite '…' started on '<device>'".
          if grep -qE "^Test suite '.*' started on '" catalyst-test.log; then
            echo "::error::A test bundle ran in parallel, which skips every Cucumber scenario. Do not mark a target parallelizable in CucumberSwift.xctestplan."
            status=1
          fi
          if [ "$status" -eq 0 ] && [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $total tests ran; at least $MIN_TESTS were expected. If you removed tests on purpose, lower MIN_TESTS in CI.yml."
            status=1
          fi
          exit $status

  # `swift test`, as CONTRIBUTING.md gives it (and `mise run test-swiftpm` runs).
  # SwiftPM links all of a package's test targets into one test bundle, and each
  # consumer test target declares its own `extension Cucumber: StepImplementation`,
  # so each consumer test folder is a package of its own and runs separately.
  swift_test:
    name: SwiftPM tests
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: swift --version
      - name: Run the root package's tests
        run: swift test --skip 'CucumberSwift\.CucumberTest'
      - name: Run the consumer tests
        run: swift test --package-path Tests/CucumberSwiftConsumerTests
      - name: Run the DSL consumer tests
        run: swift test --package-path Tests/CucumberSwiftDSLConsumerTests
      - name: Run the Swift 6 language mode consumer tests
        run: swift test --package-path Tests/CucumberSwiftSwift6ConsumerTests
