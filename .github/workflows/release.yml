name: Release

# A maintainer releases from the Actions tab: Release > Run workflow, pick the
# branch (main, or support/N.x for an older major) and patch, minor or major.
# From a terminal: gh workflow run release.yml --ref main -f bump=minor
#
# The workflow computes the version from the last release on the branch, checks
# it, runs the tests, commits the version files, and only then creates the tag
# and the release. Nothing is public until every check has passed. The release
# carries the docs and a source archive, CucumberSwift-X.Y.Z.tar.gz,
# built with git archive from the tagged commit, for Bazel registry entries.
#
# The version commit, the tag and the release are written with a short-lived
# token from the organization's release GitHub App. Its private key is a secret
# of the `release` environment, which only main and support/* can use. A push
# made with the app's token triggers CI; one made with GITHUB_TOKEN would not.
#
# Keep the name "Release": other workflows may match on it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Kind of release
        required: true
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: Only compute and check the version, and show the release notes
        type: boolean
        default: false

# Nothing by default; each job asks for what it uses.
permissions: {}

# One release run per branch at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Version file the release commit updates.
  PLIST: Sources/CucumberSwift/Info.plist
  DOCC_TARGET: CucumberSwift
  # Where the docs are served on https://cucumberswift.org: this repository's
  # Pages site. DocC bakes this path into its output. Docs built for an earlier
  # path are moved when they are published (FORMER_PATHS in docs.yml).
  DOCS_PATH: CucumberSwift
  # The commit this run releases, fixed when the run starts.
  RELEASE_SHA: ${{ github.sha }}

# `shell: bash` adds `-o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  plan:
    # Only in the cucumberswift repositories. A fork used for testing opts in with
    # the repository variable RELEASE_IN_FORK=true, and needs its own release app and
    # `release` environment. Every other job depends on this one.
    if: ${{ github.repository_owner == 'cucumberswift' || vars.RELEASE_IN_FORK == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # contents: read -> tags and history. issues/pull-requests: read -> release notes.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      branch: ${{ steps.guard.outputs.branch }}
      version: ${{ steps.plan.outputs.version }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      # Branch names and inputs are untrusted text. They reach this script only
      # as environment variables, and nothing else uses them before this check.
      - name: Check the branch, the input and who started the run
        id: guard
        env:
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$REF" == "refs/heads/main" ]]; then
            branch=main
          elif [[ "$REF" =~ ^refs/heads/support/(0|[1-9][0-9]*)\.x$ ]]; then
            branch="support/${BASH_REMATCH[1]}.x"
          else
            echo "::error::Releases run only on main or on a support/N.x branch."
            exit 1
          fi
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::bump must be patch, minor or major."; exit 1 ;;
          esac
          if ! [[ "$ACTOR" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::Only repository admins can start a release."
            exit 1
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [[ "$permission" != "admin" ]]; then
            echo "::error::Only repository admins can start a release."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Full history and all tags, to find the last release and what changed since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Read-only, and used only to read the rules: GitHub says whether the token
      # that asks may bypass them, and the release job writes as this app.
      - name: Get a read-only token from the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Compute and check the version, and write the release notes
        id: plan
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          RULES_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 .github/scripts/release.py plan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes.md

  test:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run tests
        run: fastlane unit_test

  # The only job that writes to the repository's code. It runs no project or
  # dependency code: only the release script, git and the gh CLI.
  # The whole tree is checked out, because the source archive is built from it.
  release:
    needs: [plan, test, docs-build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    # GITHUB_TOKEN only reads. The writes use the release app's token below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      # Attached to the release as it is created, so a release never exists without its docs.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
      # contents: write -> version commit, tag and release. This repository only.
      - name: Get a token from the release app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit the version, create the tag and the release
        env:
          BRANCH: ${{ needs.plan.outputs.branch }}
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          # What the source archive must contain: the Swift package, and the Bazel module
          # and its test module, which the Bazel registry entry uses.
          ARCHIVE_REQUIRES: Package.swift Sources/ MODULE.bazel BUILD.bazel REPO.bazel Tests/MODULE.bazel Tests/BUILD.bazel Tests/consumer_tests.bzl
        run: python3 .github/scripts/release.py publish

  # DocC runs project and dependency code, so it builds with read access only.
  # It builds twice, because DocC bakes the hosting path into its output: once
  # for /$DOCS_PATH/X.x/ and once for /$DOCS_PATH/. The docs job decides which
  # releases go where.
  docs-build:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # In this checkout only; nothing is committed. $VERSION, not Info.plist: this
      # commit comes before the version commit. docs.yml checks the heading.
      - name: Show the version on the landing page
        run: |
          page="Sources/$DOCC_TARGET/$DOCC_TARGET.docc/$DOCC_TARGET.md"
          if [ "$(head -n 1 "$page")" != "# \`\`$DOCC_TARGET\`\`" ] || grep -q '@Metadata' "$page"; then
            echo "::error::$page must start with its title and have no @Metadata."
            exit 1
          fi
          { head -n 1 "$page"
            printf '\n@Metadata {\n    @TitleHeading("Version %s")\n}\n' "$VERSION"
            tail -n +2 "$page"
          } > "$RUNNER_TEMP/landing.md"
          mv "$RUNNER_TEMP/landing.md" "$page"
      # Zipped, because artifact file names may not contain ":", which DocC uses.
      - name: Generate DocC static sites
        run: |
          build() {
            swift package --allow-writing-to-directory "$2" \
              generate-documentation --target "$DOCC_TARGET" \
              --disable-indexing \
              --transform-for-static-hosting \
              --hosting-base-path "$1" \
              --output-path "$2"
            (cd "$2" && zip -qr "$GITHUB_WORKSPACE/$3" .)
          }
          build "$DOCS_PATH/${VERSION%%.*}.x" docs-major docs-major.zip
          build "$DOCS_PATH" docs-root docs-root.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: |
            docs-major.zip
            docs-root.zip
          if-no-files-found: error
          retention-days: 1

  # Publishes the docs of every release, including this one, to this repository's
  # Pages site. Last, so a failure here leaves the release as it is. To publish
  # again, run Docs by hand. A release from support/N.x changes only /N.x/,
  # unless it is the highest release.
  docs:
    needs: [plan, release]
    if: ${{ !inputs.dry_run }}
    # What docs.yml needs. contents: read -> releases. pages, id-token -> deploy.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      latest: ${{ needs.plan.outputs.latest }}
