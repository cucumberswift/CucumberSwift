name: Release

# A maintainer releases from the Actions tab: Release > Run workflow, pick the
# branch (main, or support/N.x for an older major) and patch, minor or major.
# From a terminal: gh workflow run release.yml --ref main -f bump=minor
#
# The workflow computes the version from the last release on the branch, checks
# it, runs the tests, commits the version files, and only then creates the tag
# and the release. Nothing is public until every check has passed.
#
# Keep the name "Release": other workflows may match on it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Kind of release
        required: true
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: Only compute and check the version, and show the release notes
        type: boolean
        default: false

# Nothing by default; each job asks for what it uses. Only GITHUB_TOKEN is used.
permissions: {}

# One release run per branch at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Version files the release commit updates. A file that does not exist is skipped.
  PLIST: Sources/CucumberSwift/Info.plist
  PODSPEC: CucumberSwift.podspec
  DOCC_TARGET: CucumberSwift
  DOCC_BASE_PATH: CucumberSwift/
  # The commit this run releases, fixed when the run starts.
  RELEASE_SHA: ${{ github.sha }}

# `shell: bash` adds `-o pipefail`.
defaults:
  run:
    shell: bash

jobs:
  plan:
    # Only in the cucumberswift repositories. A fork used for testing opts in with
    # the repository variable RELEASE_IN_FORK=true. Every other job depends on this one.
    if: ${{ github.repository_owner == 'cucumberswift' || vars.RELEASE_IN_FORK == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: read -> tags and history. issues/pull-requests: read -> release notes.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      branch: ${{ steps.guard.outputs.branch }}
      version: ${{ steps.plan.outputs.version }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      # Branch names and inputs are untrusted text. They reach this script only
      # as environment variables, and nothing else uses them before this check.
      - name: Check the branch, the input and who started the run
        id: guard
        env:
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$REF" == "refs/heads/main" ]]; then
            branch=main
          elif [[ "$REF" =~ ^refs/heads/support/(0|[1-9][0-9]*)\.x$ ]]; then
            branch="support/${BASH_REMATCH[1]}.x"
          else
            echo "::error::Releases run only on main or on a support/N.x branch."
            exit 1
          fi
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::bump must be patch, minor or major."; exit 1 ;;
          esac
          if ! [[ "$ACTOR" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "::error::Only repository admins can start a release."
            exit 1
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [[ "$permission" != "admin" ]]; then
            echo "::error::Only repository admins can start a release."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Full history and all tags, to find the last release and what changed since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compute and check the version, and write the release notes
        id: plan
        env:
          BRANCH: ${{ steps.guard.outputs.branch }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py plan

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes.md

  test:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run tests
        run: fastlane unit_test

  # The only job that writes to the repository's code. It runs no project or
  # dependency code: only the release script, git and the gh CLI.
  release:
    needs: [plan, test]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write -> version commit, tag and release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      - name: Commit the version, create the tag and the release
        env:
          BRANCH: ${{ needs.plan.outputs.branch }}
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/release.py publish

  # DocC runs project and dependency code, so it builds with read access only.
  docs-build:
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.latest == 'true' }}
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate DocC static site
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation --target "$DOCC_TARGET" \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path "$DOCC_BASE_PATH" \
            --output-path ./docs
      # Artifact file names may not contain ":", which DocC uses. Pack the site in one file.
      - name: Pack the site
        run: tar -czf docs.tar.gz -C docs .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: docs.tar.gz

  # Pushes the built site to gh-pages, which GitHub Pages serves. Runs no
  # project code: only git and GitHub-owned actions.
  docs-publish:
    needs: [plan, release, docs-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write -> push to gh-pages. A push by GITHUB_TOKEN starts the Pages build.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
      - name: Push to gh-pages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir docs
          tar -xzf docs.tar.gz -C docs
          rsync -a --delete --exclude .git ./docs/ ./site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The site is unchanged."
            exit 0
          fi
          git commit -m "deploy: $VERSION"
          git push origin HEAD:gh-pages
