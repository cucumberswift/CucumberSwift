name: tmp-536-destinations

# Temporary (#536): runs the nightly steps that run mutation testing on an Xcode project with the Mac Catalyst destination once. Deleted before review.
on:
  push:
    branches:
      - feature/536-mutation-destinations

permissions:
  contents: read

jobs:
  destinations:
    name: Mutation testing on an Xcode project with a Mac Catalyst destination
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i -E 'ios|tvos|watchos' || true
      - name: Install the pinned Tuist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          command -v mise || brew install mise
          mise install
      - name: Run mutation testing on the Xcode project fixture with Mac Catalyst
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-xcode-catalyst"
          .github/scripts/mutation-xcode-fixture.sh "$RUNNER_TEMP/mutation-xcode-catalyst" "platform=macOS,variant=Mac Catalyst"
      - name: Upload the reports and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmp-536-destinations
          path: |
            ${{ runner.temp }}/mutation-xcode-*/mutation-MutationTestingTuist
            ${{ runner.temp }}/mutation-xcode-*/mutation-MutationTestingTuist-build.log
          if-no-files-found: ignore
          retention-days: 3
