name: tmp-589-nightly-report

# Temporary (#589): runs CI.yml's nightly_report job after jobs that fail or pass
# on purpose, since a schedule fires only on the default branch. Its issue has a
# title of its own, so it never touches a real nightly issue. Deleted before review.
on:
  push:
    branches:
      - task/589-nightly-failure-issue

permissions:
  contents: read

env:
  FAIL: 'true'

jobs:
  passes:
    name: Passes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "passes"

  fails:
    name: Fails on purpose (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        part: [one, two]
    steps:
      - run: |
          echo "FAIL=$FAIL"
          [ "$FAIL" != true ]

  nightly_report:
    name: Report the nightly run
    needs: [passes, fails]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open or comment on the nightly run's issue
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ISSUE_TITLE: Nightly CI run failed (try-out for #589)
        run: python3 .github/scripts/nightly_report.py
