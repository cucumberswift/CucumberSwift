name: Parity try

# TEMPORARY, for #561's pull request, and deleted before it is ready: the parity suite's other platforms without
# the changes gate, and a deliberate change to one runner that must fail the comparison.
on:
  push:
    branches: [task/561-conformance-suite]
    paths: ['.github/workflows/parity-try.yml']

permissions:
  contents: read

jobs:
  platforms:
    name: Parity tests (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Catalyst
            combinations: >-
              swiftpm/xctest/serial/Catalyst swiftpm/swift-testing/serial/Catalyst
              xcode/xctest/serial/Catalyst xcode/swift-testing/serial/Catalyst
              swiftpm/xctest/parallel/Catalyst swiftpm/swift-testing/parallel/Catalyst
              xcode/xctest/parallel/Catalyst xcode/swift-testing/parallel/Catalyst
          - platform: iOS
            combinations: >-
              swiftpm/xctest/serial/iOS swiftpm/swift-testing/serial/iOS
              xcode/xctest/serial/iOS xcode/swift-testing/serial/iOS
          - platform: tvOS
            combinations: >-
              swiftpm/xctest/serial/tvOS swiftpm/swift-testing/serial/tvOS
              xcode/xctest/serial/tvOS xcode/swift-testing/serial/tvOS
          - platform: watchOS
            combinations: swiftpm/xctest/serial/watchOS swiftpm/swift-testing/serial/watchOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -i -E 'ios|tvos|watchos' || true
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          # mise verifies the download's checksum through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mise --version
          mise install
      - name: Run the parity suite on ${{ matrix.platform }}
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          PARITY_COMBINATIONS: ${{ matrix.combinations }}
          PARITY_OUTPUT: ${{ runner.temp }}/parity
        run: mise run test-parity
      - name: Upload the parity runs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-runs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/parity/**/result.json
            ${{ runner.temp }}/parity/**/output.log
            ${{ runner.temp }}/parity/**/report.json
          if-no-files-found: ignore
          retention-days: 3

  # The comparison passes on the runner as it is, and fails once its report writes each step's name in capitals.
  deliberate-change:
    name: Deliberate change to the Swift Testing runner
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        run: command -v mise || brew install mise
      - name: Install the pinned Tuist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: mise install
      - name: The unchanged runner matches the golden result
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          PARITY_COMBINATIONS: swiftpm/swift-testing/serial/macOS
          PARITY_OUTPUT: ${{ runner.temp }}/parity-before
        run: mise run test-parity
      - name: A changed runner fails the comparison
        env:
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
          PARITY_COMBINATIONS: swiftpm/swift-testing/serial/macOS
          PARITY_OUTPUT: ${{ runner.temp }}/parity-after
        run: |
          sed -i '' 's/CucumberJSONReport.Step(name: step.match, keyword/CucumberJSONReport.Step(name: step.match.uppercased(), keyword/' \
            Sources/CucumberSwiftTesting/JSONReporter.swift
          git diff --stat
          git diff --quiet && { echo "::error::The change did not apply."; exit 1; }
          if mise run test-parity > "$RUNNER_TEMP/after.log" 2>&1; then
            echo "::error::The comparison passed after the runner changed."
            exit 1
          fi
          grep -F "differs from the golden result" "$RUNNER_TEMP/after.log"
          grep -E '^\+ +"[0-9]+ (Given|When|Then|And|But) [^"]*[A-Z]{4,}' "$RUNNER_TEMP/after.log" | head -5
          echo "The comparison failed, as it must."
