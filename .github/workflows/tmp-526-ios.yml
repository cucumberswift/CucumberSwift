name: tmp-526-ios

# Temporary (#526): runs the nightly coverage step's iOS part once. Deleted in the next commit.
on:
  push:
    branches:
      - task/526-feature-support-matrix

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage on iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure coverage on an iOS Simulator
        run: |
          status=0
          for platform in iOS; do
            destination=$(.github/scripts/simulator-destination.sh "$platform Simulator")
            log="$RUNNER_TEMP/coverage-$platform.log"
            (cd Fixtures/CoverageDefaultsPackage && xcodebuild test -scheme CoverageDefaultsPackage-Package \
              -destination "$destination" -enableCodeCoverage YES -skipPackagePluginValidation > "$log" 2>&1) || status=1
            grep -E 'error:|\*\* TEST (FAILED|SUCCEEDED)' "$log" | sort -u | head -20
            grep -E 'CucumberSwift coverage|warning: (Feature|Scenario|Redundant)|Test run with|Executed [0-9]+ tests' "$log" | cut -c1-260 | sort -u | head -30
            scores=$(grep -c 'CucumberSwift coverage: Grading: ' "$log" || true)
            echo "$platform: ${scores:-0} coverage summaries (2 expected, one for each runner)"
            if [ "${scores:-0}" -ne 2 ]; then
              echo "::error::CucumberSwift scored the Grading feature ${scores:-0} times on $platform, not 2."
              status=1
            fi
          done
          exit $status
