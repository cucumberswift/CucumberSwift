# Tools and tasks for working on CucumberSwift. Consumers never need these.
# See "The Xcode project" in CONTRIBUTING.md.

# The aqua backend below needs a recent mise. 2026.9.1 is the version preinstalled on the
# GitHub macOS runners, and the oldest verified to install Tuist this way.
min_version = "2026.9.1"

[tools]
# Tuist straight from its GitHub release, checked against the release's published
# checksums (aqua backend). mise's default Tuist backend runs code from a separate,
# unpinned plugin repository instead.
"aqua:tuist/tuist" = "4.209.0"

[tasks.generate]
description = "Generate CucumberSwift.xcodeproj from Project.swift"
run = "tuist generate --no-open"

[tasks.generate-fixtures]
# Not committed: Tuist names the local package's folder after the checkout's folder, which differs
# from clone to clone. CI generates it before running the fixtures.
description = "Generate the parallel testing fixtures' project from Tests/ParallelFixtures/Project.swift"
# keep-package-resolved.sh puts back the Package.resolved that resolving the project rewrites.
run = ".github/scripts/keep-package-resolved.sh tuist generate --path Tests/ParallelFixtures --no-open"

[tasks.check-project]
description = "Fail if CucumberSwift.xcodeproj differs from what Project.swift generates"
# Compares the regenerated project with the index, so a regenerated project that is
# already staged passes. CI and the pre-commit hook both run this.
# Git runs hooks with GIT_INDEX_FILE, GIT_DIR and others set. Tuist resolves packages by
# running git in each package's checkout, where those would make it read this repository's
# index and fail with "unable to read tree", so they are cleared for Tuist only. The git
# checks below keep them, so they compare against the index being committed.
run = """
(unset $(git rev-parse --local-env-vars); tuist generate --no-open)
if ! git diff --quiet -- CucumberSwift.xcodeproj || [ -n "$(git ls-files --others --exclude-standard -- CucumberSwift.xcodeproj)" ]; then
  git status --short -- CucumberSwift.xcodeproj
  echo "CucumberSwift.xcodeproj does not match Project.swift. Run 'mise run generate' and commit the result."
  exit 1
fi
"""

[tasks.test-fixtures]
description = "Build and test every project in Fixtures/"
# Each fixture is a Swift package (Package.swift), tested with `swift test`, or a Tuist project
# (Project.swift) whose project and scheme are named after its folder. See "Fixtures" in
# CONTRIBUTING.md. A Tuist fixture that uses package traits needs Xcode 26.4 or later. A Tuist
# fixture runs on macOS unless its xcodebuild-destination file names another destination.
# A fixture with an xcode-version file, such as 26.4, runs with /Applications/Xcode_<version>.app,
# so CI checks it with exactly the Xcode the docs give; without that Xcode it fails in CI and
# runs with the selected Xcode elsewhere.
# A Swift package fixture with a swift-test-arguments file runs `swift test` with the arguments it gives,
# such as --enable-code-coverage.
# A fixture's output must have no warnings from CucumberSwift other than those its expected-warnings
# lists, and every one of those (.github/scripts/fixture-warnings.sh). A fixture that uses the
# CucumberSwiftLint plugin must show that the plugin ran: its stamps are deleted first, since the
# plugin only runs when its inputs change, and the build must make new ones. A Swift package fixture
# that uses the plugin and has no expected-warnings also runs Fix Feature Files, which must change
# nothing. A fixture with expected-failures must fail its tests, with each failure it lists. A fixture
# with expected-output must print each line it lists, such as a test that must have run.
# A fixture must run at least as many XCTest and Swift Testing tests as its expected-tests lists, since
# a run can exit with success having run none (.github/scripts/fixture_tests.py).
# A fixture with expected-report writes its Cucumber JSON report to the caller's CUCUMBER_REPORT_PATH, or
# to a new path, which every test target shares, and the report must have exactly the features it lists.
# A Swift package fixture's run starts with a report that an earlier run left, so the report must not have
# its feature. A fixture with expected-report-rerun then runs its tests again at once: a Swift package
# with CUCUMBER_TAGS set to the tags it gives, an Xcode project with -only-testing for the target it gives.
# The report must then have only the features that file lists: a new run replaces the report
# (.github/scripts/fixture_report.py).
# A Swift package fixture with expected-conversion is then converted with Convert to Gherkin Macros:
# its report must have each line expected-conversion lists, and the converted tests must pass, with no
# warnings from CucumberSwift either, and run as many tests as expected-tests lists. Its Swift files are put back as they were afterwards.
# FIXTURES, a comma-separated list of folder names in Fixtures/, runs only those fixtures, such as
# FIXTURES=SwiftTestingPackage mise run test-fixtures. A name that isn't a fixture is an error, so
# that a typo fails instead of passing with nothing run.
run = '''
set -e
# Fails unless every line of $1, other than comments and blank lines, is in the output $2.
expect_all() {
  grep -v '^#' "$1" | while IFS= read -r expected; do
    [ -z "$expected" ] && continue
    if ! grep -qF "$expected" "$2"; then
      echo "error: $name: the output does not contain, as $(basename "$1") requires: $expected"
      exit 1
    fi
  done
}
# Runs a command with the fixture's Xcode, if it names one.
with_xcode() {
  if [ -n "$developer_dir" ]; then DEVELOPER_DIR="$developer_dir" "$@"; else "$@"; fi
}
if [ "${FIXTURES+x}" ]; then
  if [ -z "$(echo "$FIXTURES" | tr -d ', ')" ]; then
    echo "error: FIXTURES names no fixture"
    exit 1
  fi
  for name in $(echo "$FIXTURES" | tr ',' ' '); do
    if [ "$name" = CarthageXCFramework ]; then
      echo "error: FIXTURES names CarthageXCFramework, which mise run test-carthage runs"
      exit 1
    elif [ "$name" = CoverageMergePackage ]; then
      echo "error: FIXTURES names CoverageMergePackage, which mise run test-coverage-merge runs"
      exit 1
    elif [ ! -d "Fixtures/$name" ]; then
      echo "error: FIXTURES names $name, which is not a folder in Fixtures/"
      exit 1
    fi
  done
fi
# The report paths the caller set, which every fixture uses, and the one with expected-report checks.
caller_report="${CUCUMBER_REPORT_PATH:-}"
caller_runner_report="${TEST_RUNNER_CUCUMBER_REPORT_PATH:-}"
for fixture in Fixtures/*/; do
  name=$(basename "$fixture")
  # Needs a Carthage build first: `mise run test-carthage` runs it.
  if [ "$name" = CarthageXCFramework ]; then continue; fi
  # Runs in several ways with code coverage: `mise run test-coverage-merge` runs it.
  if [ "$name" = CoverageMergePackage ]; then continue; fi
  case ",$(echo "${FIXTURES:-$name}" | tr -d ' ')," in
    *",$name,"*) ;;
    *) continue ;;
  esac
  developer_dir=
  if [ -f "$fixture/xcode-version" ]; then
    # Only the edges are trimmed, such as a CRLF line ending.
    xcode_version=$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$fixture/xcode-version")
    if [ -d "/Applications/Xcode_$xcode_version.app" ]; then
      developer_dir="/Applications/Xcode_$xcode_version.app/Contents/Developer"
    elif [ -n "${CI:-}" ]; then
      echo "error: $name: needs Xcode $xcode_version, which this runner doesn't have"
      exit 1
    else
      echo "warning: $name: Xcode $xcode_version isn't at /Applications/Xcode_$xcode_version.app; using the selected Xcode"
    fi
  fi
  if [ -n "$developer_dir" ]; then echo "$name: with $(with_xcode xcodebuild -version | head -1)"; fi
  log=$(mktemp)
  status=0
  build="$fixture/.build"
  # `swift test` passes its environment to the tests, and `xcodebuild test` passes TEST_RUNNER_ variables
  # without the prefix. A fixture with expected-report writes to the caller's path, or to a new one.
  report=
  report_folder=
  if [ -f "$fixture/expected-report" ]; then
    report="$caller_report"
    if [ -z "$report" ]; then
      # In our CI, RUNNER_TEMP is under the home folder, which a Simulator's test processes can write to.
      report_folder=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/fixture-report.XXXXXX")
      report="$report_folder/report.json"
    fi
    export CUCUMBER_REPORT_PATH="$report" TEST_RUNNER_CUCUMBER_REPORT_PATH="$report"
    # A report that an earlier run left, as new as one can be: the run must start with an empty report
    # without anything deleting it first. The report has no record of a run, as one from Xcode has none.
    if [ -f "$fixture/Package.swift" ]; then
      mkdir -p "$(dirname "$report")"
      # A marker an earlier run left would pass the check without this run ageing the report.
      stale_suffix=$(python3 .github/scripts/fixture_report.py get "$name" expected-report ages-report 2>/dev/null || true)
      if [ -n "$stale_suffix" ]; then rm -f "$report$stale_suffix"; fi
      printf '%s\n' '[{"id":"stale","keyword":"Feature","line":1,"name":"Stale feature from an earlier run","uri":"Stale.feature","elements":[]}]' > "$report"
    fi
  fi
  if [ -f "$fixture/Package.swift" ]; then
    find "$build" -name '*.lint-stamp' -delete 2>/dev/null || true
    # A swift-test-arguments file gives the fixture's extra `swift test` arguments, such as --enable-code-coverage.
    swift_test_arguments=
    if [ -f "$fixture/swift-test-arguments" ]; then swift_test_arguments=$(cat "$fixture/swift-test-arguments"); fi
    # shellcheck disable=SC2086
    with_xcode swift test --package-path "$fixture" $swift_test_arguments > "$log" 2>&1 || status=$?
  fi
  if [ -f "$fixture/Project.swift" ]; then
    destination='platform=macOS'
    if [ -f "$fixture/xcodebuild-destination" ]; then
      destination=$(cat "$fixture/xcodebuild-destination")
    fi
    build="$fixture/Derived/xcodebuild"
    find "$build" -name '*.lint-stamp' -delete 2>/dev/null || true
    # Resolving the project rewrites the checkout's Package.resolved, so each step puts it back.
    with_xcode .github/scripts/keep-package-resolved.sh tuist generate --no-open --path "$fixture"
    with_xcode .github/scripts/keep-package-resolved.sh xcodebuild test -project "$fixture/$name.xcodeproj" -scheme "$name" -destination "$destination" \
      -derivedDataPath "$build" -skipMacroValidation CODE_SIGNING_ALLOWED=NO > "$log" 2>&1 || status=$?
  fi
  cat "$log"
  if [ -f "$fixture/expected-failures" ]; then
    if [ "$status" -eq 0 ]; then
      echo "error: $name: its tests passed, but they should fail with each failure in expected-failures"
      exit 1
    fi
    expect_all "$fixture/expected-failures" "$log"
    echo "$name: the tests failed with every expected failure."
  elif [ "$status" -ne 0 ]; then
    exit "$status"
  fi
  python3 .github/scripts/fixture_tests.py "$fixture" "$log"
  if [ -n "$report" ]; then
    # The marker that a fixture's first runner writes after it sets the report's age.
    aged_suffix=$(python3 .github/scripts/fixture_report.py get "$name" expected-report ages-report 2>/dev/null || true)
    if [ -n "$aged_suffix" ] && [ ! -e "$report$aged_suffix" ]; then
      echo "error: $name: the fixture didn't age the report: there is no $report$aged_suffix"
      exit 1
    fi
    python3 .github/scripts/fixture_report.py check "$name" expected-report < "$report"
    if [ -f "$fixture/expected-report-rerun" ]; then
      rerun_log=$(mktemp)
      rerun_status=0
      if [ -f "$fixture/Package.swift" ]; then
        rerun_tags=$(python3 .github/scripts/fixture_report.py get "$name" expected-report-rerun tags)
        CUCUMBER_TAGS="$rerun_tags" with_xcode swift test --package-path "$fixture" > "$rerun_log" 2>&1 || rerun_status=$?
      else
        rerun_target=$(python3 .github/scripts/fixture_report.py get "$name" expected-report-rerun only-testing)
        with_xcode .github/scripts/keep-package-resolved.sh xcodebuild test -project "$fixture/$name.xcodeproj" -scheme "$name" \
          -destination "$destination" -derivedDataPath "$build" -skipMacroValidation CODE_SIGNING_ALLOWED=NO \
          -only-testing:"$rerun_target" > "$rerun_log" 2>&1 || rerun_status=$?
      fi
      cat "$rerun_log"
      rm -f "$rerun_log"
      if [ "$rerun_status" -ne 0 ]; then exit "$rerun_status"; fi
      python3 .github/scripts/fixture_report.py check "$name" expected-report-rerun < "$report"
    fi
    if [ -n "$report_folder" ]; then rm -rf "$report_folder"; fi
    if [ -n "$caller_report" ]; then export CUCUMBER_REPORT_PATH="$caller_report"; else unset CUCUMBER_REPORT_PATH; fi
    if [ -n "$caller_runner_report" ]; then
      export TEST_RUNNER_CUCUMBER_REPORT_PATH="$caller_runner_report"
    else
      unset TEST_RUNNER_CUCUMBER_REPORT_PATH
    fi
  fi
  if [ -f "$fixture/expected-output" ]; then
    expect_all "$fixture/expected-output" "$log"
    echo "$name: the output has every line in expected-output."
  fi
  if grep -qs CucumberSwiftLint "$fixture/Package.swift" "$fixture/Project.swift"; then
    if [ -z "$(find "$build" -name '*.lint-stamp' 2>/dev/null)" ]; then
      echo "error: $name: uses the CucumberSwiftLint plugin, but the plugin didn't run"
      exit 1
    fi
    if [ -f "$fixture/Package.swift" ] && [ ! -f "$fixture/expected-warnings" ]; then
      before=$(find "$fixture" -name '*.feature' -not -path "$build/*" -exec shasum {} +)
      fix_log=$(mktemp)
      fix_status=0
      with_xcode swift package --package-path "$fixture" --allow-writing-to-package-directory fix-feature-files \
        > "$fix_log" 2>&1 || fix_status=$?
      cat "$fix_log"
      cat "$fix_log" >> "$log"
      rm -f "$fix_log"
      if [ "$fix_status" -ne 0 ]; then exit "$fix_status"; fi
      if [ "$before" != "$(find "$fixture" -name '*.feature' -not -path "$build/*" -exec shasum {} +)" ]; then
        echo "error: $name: Fix Feature Files changed a feature file"
        exit 1
      fi
      echo "$name: Fix Feature Files changed nothing."
    fi
  fi
  if [ -f "$fixture/Package.swift" ] && [ -f "$fixture/expected-conversion" ]; then
    # The command rewrites the fixture's Swift files, so a copy of them is put back however this ends.
    swift_files() { find "$fixture" -name '*.swift' -not -path "$build/*" -exec shasum {} + | sort; }
    before=$(swift_files)
    originals=$(mktemp)
    (cd "$fixture" && find . -name '*.swift' -not -path './.build/*' -print0 | tar -cf "$originals" --null -T -)
    trap 'tar -xf "$originals" -C "$fixture"' EXIT
    conversion_log=$(mktemp)
    conversion_status=0
    with_xcode swift package --package-path "$fixture" --allow-writing-to-package-directory convert-to-gherkin-macros \
      > "$conversion_log" 2>&1 || conversion_status=$?
    cat "$conversion_log"
    if [ "$conversion_status" -ne 0 ]; then exit "$conversion_status"; fi
    expect_all "$fixture/expected-conversion" "$conversion_log"
    converted_status=0
    with_xcode swift test --package-path "$fixture" > "$conversion_log" 2>&1 || converted_status=$?
    cat "$conversion_log"
    cat "$conversion_log" >> "$log"
    if [ "$converted_status" -ne 0 ]; then
      echo "error: $name: its tests failed once Convert to Gherkin Macros had converted it"
      exit "$converted_status"
    fi
    python3 .github/scripts/fixture_tests.py "$fixture" "$conversion_log"
    rm -f "$conversion_log"
    tar -xf "$originals" -C "$fixture"
    trap - EXIT
    rm -f "$originals"
    if [ "$before" != "$(swift_files)" ]; then
      echo "error: $name: its Swift files weren't put back as they were before Convert to Gherkin Macros"
      exit 1
    fi
    echo "$name: Convert to Gherkin Macros converted it as expected-conversion lists, and its tests passed."
  fi
  .github/scripts/fixture-warnings.sh "$fixture" "$log"
  rm -f "$log"
done
'''

[tasks.test-carthage]
description = "Build the framework with Carthage and test a project that uses it"
# Builds Carthage/Build/CucumberSwift.xcframework as `carthage update` does for a consumer, then
# runs Fixtures/CarthageXCFramework, an iOS test target that links and embeds it, on a simulator.
# The fixture must run as many tests as its expected-tests lists, and with Xcode 26 or later
# CucumberSwift must score its feature.
# See "Fixtures" in CONTRIBUTING.md.
run = '''
set -eu
derived=$(mktemp -d)
carthage build --no-skip-current --use-xcframeworks --platform iOS --derived-data "$derived" \
  --log-path "${CARTHAGE_LOG:-${TMPDIR:-/tmp}/carthage-build.log}"
# CucumberSwift.swiftmodule records this build's search paths, which still hold every module the
# build made. A consumer's machine doesn't have them, so remove them before the consumer builds.
rm -rf "$derived"
xcf=Carthage/Build/CucumberSwift.xcframework
# CucumberSwiftExpressions is static, so its code is inside the framework rather than a separate
# dynamic dependency that Carthage would not deliver.
for binary in "$xcf"/*/CucumberSwift.framework/CucumberSwift; do
  if otool -L "$binary" | grep -i CucumberSwiftExpressions; then
    echo "$binary links CucumberSwiftExpressions dynamically, which Carthage does not deliver"
    exit 1
  fi
done
# The pinned Tuist can't compile the fixture's manifest with Xcode 16.0's Swift 6.0, so when CI tests
# that Xcode, TUIST_DEVELOPER_DIR names a newer one for this step. The fixture still builds and
# tests with the selected Xcode.
if [ -n "${TUIST_DEVELOPER_DIR:-}" ]; then
  DEVELOPER_DIR="$TUIST_DEVELOPER_DIR" tuist generate --no-open --path Fixtures/CarthageXCFramework
else
  tuist generate --no-open --path Fixtures/CarthageXCFramework
fi
simulator=$(xcrun simctl list devices available --json | python3 -c '
import json, sys
runtimes = json.load(sys.stdin)["devices"]
ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(n) for n in r.rsplit("iOS-", 1)[1].split("-")])
print(next(d["udid"] for r in reversed(ios) for d in runtimes[r] if d["name"].startswith("iPhone")))
')
log=$(mktemp)
set -o pipefail
xcodebuild test -project Fixtures/CarthageXCFramework/CarthageXCFramework.xcodeproj \
  -scheme CarthageXCFramework -destination "platform=iOS Simulator,id=$simulator" \
  -derivedDataPath "$(mktemp -d)" CODE_SIGNING_ALLOWED=NO | tee "$log"
# A step that matches no step definition doesn't fail the run, so check the last step ran.
if ! grep -q "Then the basket holds 1 cuke\]' passed" "$log"; then
  echo "The fixture's scenario did not run all its steps"
  exit 1
fi
python3 .github/scripts/fixture_tests.py Fixtures/CarthageXCFramework "$log"
# The fixture's framework is built with code coverage, so CucumberSwift must score the feature.
# CucumberSwift reads only Xcode 26's coverage formats, so the check runs only with Xcode 26 or
# later until #552 adds Xcode 16 support.
xcode_major=$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')
if [ "$xcode_major" -lt 26 ]; then
  echo "Skipping the scoring check: CucumberSwift's coverage needs Xcode 26 or later (#552)"
elif ! grep -q "CucumberSwift coverage: CucumberSwift from the Carthage-built xcframework: 100% of the code its scenarios ran (4 of 4 regions in 1 function).*redundancy 33%" "$log"; then
  echo "CucumberSwift did not score the fixture's feature"
  exit 1
fi
'''

[tasks.test-coverage-merge]
description = "Check that cucumberswift coverage merge scores parallel and sharded runs as one run"
# Runs Fixtures/CoverageMergePackage with code coverage one scenario at a time, with Xcode's parallel
# testing and in 2 shards, with each runner, and fails unless the merged scores are the same every way.
# See "Fixtures" in CONTRIBUTING.md.
run = ".github/scripts/coverage-merge-fixture.sh"

[tasks.test-docs-examples]
description = "Compile every Swift example in the DocC catalog"
# Needs Swift 6.1 or later. See "The documentation's examples" in CONTRIBUTING.md.
run = "python3 .github/scripts/docs_examples.py"

[tasks.test-swiftpm]
description = "Run every test target with Swift Package Manager"
# SwiftPM links all of a package's test targets into one bundle, so each consumer
# test folder is a package of its own. See "Running the tests" in CONTRIBUTING.md.
run = [
  "swift test --enable-all-traits --skip 'CucumberSwift\\.CucumberTest'",
  "swift test --package-path Tests/CucumberSwiftConsumerTests",
  "swift test --package-path Tests/CucumberSwiftDSLConsumerTests",
  "swift test --package-path Tests/CucumberSwiftSwift6ConsumerTests",
]
