# SonarQube Cloud analysis, run by the SonarQube Cloud job in .github/workflows/CI.yml.
sonar.host.url=https://sonarcloud.io
sonar.organization=cucumberswift
sonar.projectKey=cucumberswift_CucumberSwift

sonar.sources=Sources
sonar.tests=Tests
sonar.sourceEncoding=UTF-8
# The DocC catalog is documentation, and I18n.swift is generated by SwiftGen.
sonar.exclusions=Sources/CucumberSwift/CucumberSwift.docc/**,Sources/CucumberSwift/Generated/**

# Written by the test job from its Xcode coverage (.github/scripts/sonar_coverage.py).
sonar.coverageReportPaths=sq-generic.xml
